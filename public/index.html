<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Juniper Valley Transit — Live Demo</title>

  <!-- Leaflet: free, open-source map library. Map tiles come from OpenStreetMap. -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; color: #222; background: #fff;
           display: flex; flex-direction: column; height: 100vh; }
    header { padding: 12px 16px; background: #2f4858; color: #fff; }
    header h1 { margin: 0; font-size: 1.3rem; }
    header p { margin: 4px 0 0; font-size: 0.85rem; opacity: 0.9; }
    main { flex: 1; display: flex; min-height: 0; }
    #sidebar { width: 300px; overflow-y: auto; padding: 12px 16px; border-right: 1px solid #ddd; }
    #map { flex: 1; }
    .route { margin-bottom: 14px; }
    .route h2 { font-size: 1rem; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
    .swatch { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
    .route p { margin: 0; font-size: 0.85rem; color: #555; }
    #clock { font-size: 0.85rem; color: #555; margin-bottom: 12px; }
    .bus { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #fff;
           box-shadow: 0 0 3px rgba(0,0,0,0.6); }
    /* On phones: stack the sidebar above the map. */
    @media (max-width: 700px) {
      main { flex-direction: column; }
      #sidebar { width: 100%; max-height: 35vh; border-right: none; border-bottom: 1px solid #ddd; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Juniper Valley Transit — Live Demo</h1>
    <p>Simulated buses on Santa Fe streets. Demo only, not affiliated with the City of Santa Fe.</p>
  </header>

  <main>
    <aside id="sidebar">
      <div id="clock">Loading…</div>
      <div id="routes"></div>
    </aside>
    <div id="map"></div>
  </main>

  <script>
    // 1. Create the map, centered on Santa Fe.
    const map = L.map('map').setView([35.665, -105.965], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors',
    }).addTo(map);

    const busMarkers = {};   // bus id -> Leaflet marker
    let routesDrawn = false;

    // 2. Draw route lines and stops (only needed once).
    function drawRoutes(routes) {
      const allPoints = [];
      for (const route of routes) {
        allPoints.push(...route.path);
        L.polyline(route.path, { color: route.color, weight: 5, opacity: 0.7 }).addTo(map);
        for (const stop of route.stops) {
          L.circleMarker([stop.lat, stop.lng], {
            radius: 6, color: route.color, fillColor: '#fff', fillOpacity: 1, weight: 3,
          }).addTo(map).bindTooltip(stop.name);
        }
      }
      map.fitBounds(allPoints, { padding: [20, 20] }); // zoom so every route fits
      routesDrawn = true;
    }

    // 3. Fill the sidebar with each route and its next departures.
    function drawSidebar(snapshot) {
      document.getElementById('clock').textContent =
        `${snapshot.day} ${snapshot.now} (Santa Fe time) · ${snapshot.vehicles.length} buses running`;

      document.getElementById('routes').innerHTML = snapshot.routes.map((r) => `
        <div class="route">
          <h2><span class="swatch" style="background:${r.color}"></span>Route ${r.id} – ${r.name}</h2>
          <p>Next from ${r.stops[0].name}: ${r.nextDepartures.length ? r.nextDepartures.join(', ') : 'no more trips today'}</p>
        </div>`).join('');
    }

    // 4. Add, move, or remove bus markers.
    function drawBuses(vehicles) {
      const seen = new Set();
      for (const bus of vehicles) {
        seen.add(bus.id);
        const label = `Route ${bus.routeId}${bus.headingTo ? ' to ' + bus.headingTo : ''}<br>Next stop: ${bus.nextStop || 'end of trip'}`;
        if (busMarkers[bus.id]) {
          busMarkers[bus.id].setLatLng([bus.lat, bus.lng]).setTooltipContent(label);
        } else {
          const icon = L.divIcon({ className: '', html: `<div class="bus" style="background:${bus.color}"></div>`, iconSize: [16, 16] });
          busMarkers[bus.id] = L.marker([bus.lat, bus.lng], { icon }).addTo(map).bindTooltip(label);
        }
      }
      // Remove buses that finished their trip.
      for (const id of Object.keys(busMarkers)) {
        if (!seen.has(id)) { map.removeLayer(busMarkers[id]); delete busMarkers[id]; }
      }
    }

    // 5. Ask the server for fresh data, then update the page.
    async function refresh() {
      try {
        const snapshot = await (await fetch('/api/live')).json();
        if (!routesDrawn) drawRoutes(snapshot.routes);
        drawSidebar(snapshot);
        drawBuses(snapshot.vehicles);
      } catch (err) {
        document.getElementById('clock').textContent = 'Could not reach the server. Retrying…';
      }
    }

    refresh();
    setInterval(refresh, 5000); // every 5 seconds
  </script>
</body>
</html>
